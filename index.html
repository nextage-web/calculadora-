<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média</title>
</head>
<body>
    <div>
        <h1>Calculadora de média</h1>
        <input type="number" max="10" id="nota1" placeholder="Insira a nota 1">
        <input type="number" max="10" id="nota2" placeholder="Insira a nota 2">
        <input type="number" max="10" id="nota3" placeholder="Insira a nota 3">

        <button id="calcular" onclick="calcular()">Calcular</button>

        <p>A sua média é: <span id="media"></span></p>
        <p>Status: <span id="status"></span></p>
    </div>

    <script>
        function calcular(){
            var n1, n2, n3, media;

            n1 = document.getElementById('nota1').value;
            n2 = document.getElementById('nota2').value;
            n3 = document.getElementById('nota3').value;

            media = (parseFloat(n1) + parseFloat(n2) + parseFloat(n3)) / 3;

            document.getElementById('media').innerHTML = media;

            if(media < 7){
                document.getElementById('status').innerHTML = "Reprovado";
            }else{
                document.getElementById('status').innerHTML = "Aprovado";
            }
        }
    </script>
</body>
</html>
